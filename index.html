<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miguel</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, #0f0f12 0%, #1a1a24 50%, #12121a 100%);
      color: #ffffff;
      padding: 2rem;
    }

    main {
      text-align: center;
      max-width: 520px;
    }

    .greeting {
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #8b8b9e;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      background: linear-gradient(to right, #ffffff, #c4c4d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 1.25rem;
      font-weight: 400;
      line-height: 1.6;
      color: #b8b8c8;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: linear-gradient(to right, #f97316, #ec4899);
      border-radius: 2px;
      margin: 2rem auto;
    }

    .learn-section {
      margin-top: 3rem;
      text-align: left;
    }

    .learn-section h2 {
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #8b8b9e;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .learn-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .learn-list li {
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      font-size: 1rem;
      color: #e8e8f0;
      transition: background 0.2s, border-color 0.2s;
    }

    .learn-list li:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .contact-btn {
      margin-top: 2.5rem;
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      color: #ffffff;
      background: linear-gradient(to right, #f97316, #ec4899);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 4px 20px rgba(249, 115, 22, 0.3);
    }

    .contact-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(236, 72, 153, 0.4);
    }

    .contact-btn.clicked {
      background: linear-gradient(to right, #ec4899, #f97316);
      box-shadow: 0 4px 20px rgba(236, 72, 153, 0.5);
    }
  </style>
</head>
<body>
  <main>
    <p class="greeting">Hola, soy</p>
    <h1>Miguel</h1>
    <div class="divider"></div>
    <p class="tagline">Estoy aprendiendo a crear apps</p>

    <section class="learn-section">
      <h2>Lo que quiero aprender este verano</h2>
      <ul class="learn-list">
        <li>Programación</li>
        <li>Diseño de apps</li>
        <li>Marketing digital</li>
      </ul>
    </section>

    <button class="contact-btn" id="contactBtn">Contáctame</button>
  </main>

  <script>
    document.getElementById("contactBtn").addEventListener("click", function () {
      this.classList.toggle("clicked");
    });
  </script>
</body>
</html>
